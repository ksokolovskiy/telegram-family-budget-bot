services:
  postgres:
    image: postgres:16-alpine
    container_name: budget-bot-postgres
    environment:
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:?set in private .env}
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:?set in private .env}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?set in private .env}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budget_bot"]
      interval: 5s
      timeout: 5s
      retries: 20

  bot:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    command: sh -c "alembic upgrade head && python -m app.main"
    restart: unless-stopped

  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    command: python -m app.worker
    restart: unless-stopped

volumes:
  postgres_data:
