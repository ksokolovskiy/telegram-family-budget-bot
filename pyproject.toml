[project]
name = "telegram-family-budget-bot"
version = "0.1.0"
description = "AI-powered Telegram family budget bot"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10,<4",
  "aiogram>=3.31,<4",
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "cryptography>=43,<46",
  "openai>=1.35,<4",
  "pydantic-settings>=2.3,<3",
  "playwright>=1.52,<2",
  "PyMuPDF>=1.24,<2",
  "python-dotenv>=1.0,<2",
  "sqlalchemy[asyncio]>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.5,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep the same baseline in local environments and newer CI installations.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
