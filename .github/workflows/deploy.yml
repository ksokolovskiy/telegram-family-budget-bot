name: Deploy to ksokol2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ksokol2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.KSOKOL2_SSH_KEY }}" > ~/.ssh/ksokol2_key
          chmod 600 ~/.ssh/ksokol2_key
          ssh-keyscan -p "${{ secrets.KSOKOL2_PORT || '22' }}" "${{ secrets.KSOKOL2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload source
        run: |
          DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
          ssh -i ~/.ssh/ksokol2_key -p "${{ secrets.KSOKOL2_PORT || '22' }}" "${{ secrets.KSOKOL2_USER }}@${{ secrets.KSOKOL2_HOST }}" "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/ksokol2_key -p ${{ secrets.KSOKOL2_PORT || '22' }}" \
            --exclude '.git' --exclude '.env' \
            ./ "${{ secrets.KSOKOL2_USER }}@${{ secrets.KSOKOL2_HOST }}:$DEPLOY_PATH/"

      - name: Configure and restart
        run: |
          ssh -i ~/.ssh/ksokol2_key -p "${{ secrets.KSOKOL2_PORT || '22' }}" "${{ secrets.KSOKOL2_USER }}@${{ secrets.KSOKOL2_HOST }}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "${{ secrets.DEPLOY_PATH }}"

          POSTGRES_CONTAINER="${{ secrets.POSTGRES_CONTAINER || 'central-postgres' }}"
          POSTGRES_DB="${{ secrets.POSTGRES_DB }}"
          POSTGRES_USER="${{ secrets.POSTGRES_USER }}"
          POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
          DOCKER_NETWORK="${{ secrets.DOCKER_NETWORK }}"

          docker network inspect "$DOCKER_NETWORK" >/dev/null
          docker inspect "$POSTGRES_CONTAINER" >/dev/null
          if ! docker inspect -f '{{json .NetworkSettings.Networks}}' "$POSTGRES_CONTAINER" | grep -q "\"$DOCKER_NETWORK\""; then
            docker network connect "$DOCKER_NETWORK" "$POSTGRES_CONTAINER"
          fi

          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" "$POSTGRES_CONTAINER" \
            psql -U "$POSTGRES_USER" -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '$POSTGRES_DB'" | grep -q 1 \
            || docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" "$POSTGRES_CONTAINER" \
              createdb -U "$POSTGRES_USER" "$POSTGRES_DB"

          cat > .env <<ENV
          BOT_TOKEN=${{ secrets.BOT_TOKEN }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL=${{ secrets.OPENAI_MODEL || 'gpt-4o-mini' }}
          DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_CONTAINER}:5432/${POSTGRES_DB}
          LOG_LEVEL=INFO
          APP_ENV=production
          DOCKER_NETWORK=${DOCKER_NETWORK}
          ENV

          docker compose -f docker-compose.prod.yml up -d --build
          docker compose -f docker-compose.prod.yml ps
          REMOTE
